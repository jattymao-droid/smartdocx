<p style="margin:6px 0;text-align:justify">阅读下面的诗歌，完成下面小题。</p><p style="margin:6px 0;text-align:center"><b>芣苢</b></p><p style="margin:6px 0;text-align:center"><span>采采芣苢，薄言采之。采采芣苢，薄言有之。</span></p><p style="margin:6px 0;text-align:center"><span>采采芣苢，薄言掇之。采采芣苢，薄言捋之。</span></p><p style="margin:6px 0;text-align:center"><span>采采芣苢，薄言袺之。采采芣苢，薄言襭之。</span></p>1．下面对诗歌的理解与分析，不正确的一项是（<span>     </span>）<table style="border-collapse:collapse;margin:8px 0;max-width:100%;width:100%"><tbody><tr><td style="border:1px solid #333;text-align:center;vertical-align:middle">A．这是一曲劳动的欢歌，表现了当时人们采芣苢时虽然劳苦但又充满乐趣的场面。</td></tr><tr><td style="border:1px solid #333;text-align:center;vertical-align:middle">B．全诗三章，每章四句，全是重章叠句，仅仅变换了少数几个动词。</td></tr><tr><td style="border:1px solid #333;text-align:center;vertical-align:middle">C．这种重章叠句的形式，看似很单调的重叠，却在不断重叠中，产生了简单明快、往复回环的音乐感。</td></tr><tr><td style="border:1px solid #333;text-align:center;vertical-align:middle">D．诗歌反复地表达劳动的过程，充满了劳动的欢欣，洋溢着劳动的热情。</td></tr></tbody></table>2．这首诗生动地表现了采集野菜的劳作过程，在诗中是怎样具体表现出来的？
